<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<title>Cards Index</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<style>
  /* =========================================================
     調整ポイント（ここだけ触ればサイズ感が決まります）
     ---------------------------------------------------------
     --wrap-pad  : 画面の余白
     --grid-gap  : ボタン同士の間隔
     --card-min  : ボタンの最小幅（小さいほど列数が増える）
     --card-h    : ボタンの縦高さ（← 縦幅はここを変更）
     --card-padX : 左右の内側余白（横のゆとり）
     --card-fz   : 文字サイズ（clampで画面に追従）
  ========================================================= */
  :root{
    color-scheme: light dark;
    --wrap-pad: 16px;
    --grid-gap: 10px;
    --card-min: 98px;                         /* iPhoneでも3列を狙う幅 */
    --card-h: 40px;                           /* ← 縦幅はココ。例: 36, 44, 48… */
    --card-padX: 12px;
    --card-fz: clamp(12px, 1.7vw, 16px);
  }

  /* カラーテーマ（現状維持） */
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#111; --fg:#ddd;
      --card-bg:#222; --card-border:#333; --card-hover:#333;
    }
  }
  @media (prefers-color-scheme: light){
    :root{
      --bg:#fff; --fg:#111;
      --card-bg:#fafafa; --card-border:#ccc; --card-hover:#f0f0f0;
    }
  }

  /* 全体 */
  body{
    font-family:sans-serif;
    margin:0;
    padding:var(--wrap-pad);
    background:var(--bg);
    color:var(--fg);
    transition:.2s;
  }

  h1{font-size:22px;margin:0 0 12px}

  /* グリッド：可能な限り横に並べる */
  #list{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(var(--card-min), 1fr));
    gap:var(--grid-gap);
    align-items:stretch;
  }

  /* ボタン */
  a.card{
    display:flex;                 /* 中身を縦中央に寄せる */
    align-items:center;
    height:var(--card-h);         /* ← 縦幅固定（ここで一括変更） */
    padding:0 var(--card-padX);   /* 上下は0、左右だけ余白 */
    border:1px solid var(--card-border);
    border-radius:12px;
    text-decoration:none;
    color:inherit;
    background:var(--card-bg);
    font-size:var(--card-fz);
    line-height:1;                /* 文字の上下余白を抑える */
    transition:.2s;

    /* 1行固定・改行禁止・はみ出し非表示（省略記号）*/
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  a.card:hover{ background:var(--card-hover); }

  /* 画面が極端に狭い時の最小幅の保険 */
  @media (max-width:360px){
    :root{ --card-min: 94px; }
  }
</style>
</head>
<body>
<h1>Cards</h1>
<!-- 説明文は削除 -->

<div id="list">読み込み中…</div>

<script>
/* Cloud Storage 上の index.json のURL（公開URLを貼る） */
const API_URL = "https://storage.googleapis.com/works2511-f9693.firebasestorage.app/cards/index.json";

async function main(){
  const wrap = document.getElementById("list");
  try{
    const res = await fetch(API_URL, {cache:"no-store"});
    if(!res.ok) throw new Error("Fetch failed: " + res.status);
    const sheets = await res.json(); // 例: [{"slug":"mahjong","title":"麻雀"},...]

    wrap.innerHTML = "";
    if(!sheets.length){
      wrap.textContent = "シートが見つかりません。";
      return;
    }

    sheets.forEach(obj=>{
      const a = document.createElement("a");
      a.className = "card";
      // slugがあればslug、なければtitleやnameを使用（従来仕様を維持）
      const slug = obj.slug || obj.title || obj.name;
      a.href = `page.html?sheet=${encodeURIComponent(slug)}`;
      a.textContent = obj.title || slug; // 表示は1行固定・はみ出し非表示（CSSで制御）
      wrap.appendChild(a);
    });

  }catch(e){
    console.error(e);
    wrap.textContent = "取得エラー";
  }
}
main();
</script>
</body>
</html>
