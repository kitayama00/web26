<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<title>Card</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<style>
/* ===== 学習者向け：サイズ調整ポイント =====
   --foot-btn-fz / --foot-btn-pad … 下バーのボタンサイズ
   --foot-h … フッター高さ（本文の下余白に反映）
*/
*{box-sizing:border-box}
:root{
  --pad:14px;
  --foot-btn-fz:18px;           /* #下バー文字サイズ */
  --foot-btn-pad:10px 18px;     /* #下バーパディング */
  --foot-h:74px;                /* #フッター高さ */
  --ui-bg:#0f1318;
  --ui-border:#2a2f36;
  --ui-text:#e6e6e6;
  --btn-border:#5e6a75;
  --accent:#89b4ff;
}
@media (max-width:480px){
  :root{
    --foot-btn-fz:16px;
    --foot-btn-pad:8px 14px;
    --foot-h:68px;
  }
}
@media (prefers-color-scheme:light){
  :root{
    --ui-bg:#f7f8fa;
    --ui-border:#d5d9df;
    --ui-text:#1c2127;
    --btn-border:#66707a;
    --accent:#1e66f5;
  }
}
html,body{height:100%}
body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,"Hiragino Kaku Gothic ProN","Meiryo",sans-serif;
  background:var(--ui-bg);
  color:var(--ui-text);
  padding-bottom:calc(var(--foot-h) + env(safe-area-inset-bottom));
}

/* 上バー */
header{
  position:sticky; top:0;
  background:var(--ui-bg);
  border-bottom:1px solid var(--ui-border);
  padding:6px var(--pad);
  z-index:20;
}
.topbar{
  display:flex; align-items:center; gap:8px;
  flex-wrap:nowrap; overflow-x:auto; scrollbar-width:none;
}
.topbar::-webkit-scrollbar{display:none}
.count{white-space:nowrap; opacity:.9; margin-right:2px}
.btn{border:1px solid var(--btn-border); background:transparent; color:var(--ui-text);
     border-radius:12px; padding:6px 10px; font-size:14px; line-height:1; cursor:pointer; user-select:none}
.btn:active{transform:translateY(1px)}
select{
  font-size:14px; padding:6px 20px 6px 8px;
  border-radius:12px; border:1px solid var(--btn-border);
  background:transparent; color:inherit; max-width:30vw;
}
@media (max-width:480px){ select{max-width:44vw} }
.ck{display:inline-flex;align-items:center;gap:6px}
.ck input{width:18px;height:18px}
.ck small{font-size:13px}

/* 左サイドバー（List） */
.drawer{
  position:fixed; inset:0 auto 0 0; width:min(320px,90vw);
  background:var(--ui-bg); border-right:1px solid var(--ui-border);
  transform:translateX(-100%); transition:transform .2s ease; z-index:30;
  display:flex; flex-direction:column; max-height:100dvh;
  padding-top:env(safe-area-inset-top);
}
.drawer.open{transform:translateX(0)}
.dh{display:flex;align-items:center;gap:8px;padding:10px;border-bottom:1px solid var(--ui-border)}
.dh .close{margin-left:auto}
.shortcut{padding:10px;border-bottom:1px solid var(--ui-border);display:flex;gap:6px;align-items:center}
.shortcut select{max-width:none}
.listbox{overflow:auto;padding:8px}
.word{padding:8px 10px;border-radius:8px;cursor:pointer}
.word:hover{background:rgba(136,165,191,.12)}
.word.active{outline:2px solid var(--accent)}
.word.learned{opacity:.45}

/* 本文 */
.wrap{max-width:980px;margin:0 auto;padding:10px var(--pad)}
.card{border-radius:14px; padding:16px; background:transparent; border:1px solid var(--ui-border); min-height:160px}
.front{font-size:36px; font-weight:800; letter-spacing:.2px}
.back .section{margin:12px 0}
.sec-title{font-size:12px;opacity:.65;margin:0 0 4px}
.sec-body{font-size:16px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
audio,video{width:100%;margin:8px 0}
img.cardimg{width:100%;height:auto;border:1px solid var(--ui-border);border-radius:10px;object-fit:contain;background:#000;margin:8px 0;max-height:460px}
a.inline{color:var(--accent);text-decoration:none} a.inline:hover{text-decoration:underline}

/* 下ナビ */
footer.nav{
  position:fixed; left:0; right:0; bottom:0;
  background:var(--ui-bg); border-top:1px solid var(--ui-border);
  padding:10px calc(var(--pad) + env(safe-area-inset-left)) calc(10px + env(safe-area-inset-bottom)) calc(var(--pad) + env(safe-area-inset-right));
  display:flex; gap:10px; justify-content:center; z-index:25;
}
footer.nav button{
  font-size:var(--foot-btn-fz); padding:var(--foot-btn-pad);
  color:#fff; background:transparent; border:2px solid var(--btn-border);
  border-radius:14px; touch-action:manipulation; -webkit-user-select:none; user-select:none;
}
footer.nav button:active{transform:translateY(1px)}
</style>
</head>
<body>

<!-- 左サイドバー（List） -->
<aside id="drawer" class="drawer" aria-hidden="true">
  <div class="dh">
    <strong>List</strong>
    <button class="btn close" id="closeDrawer">Close</button>
  </div>
  <div class="shortcut">
    <label style="white-space:nowrap">Jump:</label>
    <select id="jumpSelect"></select>
    <button class="btn" id="jumpGo">Go</button>
  </div>
  <div class="listbox" id="listBox"></div>
</aside>

<header>
  <div class="topbar" id="topbar">
    <div class="count" id="count">0 / 0</div>
    <button class="btn" id="listBtn">List</button>
    <button class="btn" id="topBtn">Top</button>

    <select id="frontSelect"></select>

    <span style="flex:1"></span>
    <label class="ck"><input type="checkbox" id="mixChk"><small>交</small></label>
    <label class="ck"><input type="checkbox" id="headlineAdd"><small>見</small></label>
    <label class="ck"><input type="checkbox" id="hideLearned" checked><small>非</small></label>
    <label class="ck"><input type="checkbox" id="learnedChkTop"><small>OK</small></label>
  </div>
</header>

<div class="wrap">
  <div class="card" id="card">
    <div id="front" class="front">読み込み中…</div>
    <div id="back" class="back" style="display:none">
      <div id="backContainer"></div>
    </div>
  </div>
</div>

<footer class="nav">
  <button id="prevBtn">◀ 前</button>
  <button id="nextBtn">次 ▶</button>
</footer>

<script>
/* ===== 設定 ===== */
const API_URL = "https://storage.googleapis.com/works2511-f9693.firebasestorage.app/cards/";
const SOZAI_BASE_URL = API_URL + "sozai/";
const FRONT_PREFER = ["英単語","単語","word","Word"];
const YT_MODE = (location.protocol === "file:") ? "link" : "auto";
/* ================= */

const SHEET = new URLSearchParams(location.search).get("sheet") || "";
const KEY_PREFIX = `cards:${SHEET}:`;
const FRONT_STORE_KEY = `cards:${SHEET}:frontCol`;
const HEAD_STORE_KEY  = `cards:${SHEET}:heads`;

const getKey  = w => KEY_PREFIX + w;
const isLearn = w => localStorage.getItem(getKey(w)) === "1";
const setLearn = (w,v) => v ? localStorage.setItem(getKey(w),"1") : localStorage.removeItem(getKey(w));

let rowsAll = [], headers = [], rowsView = [], order = [];
let idx = 0, showBack = false, lastAudio = null;

const $ = id => document.getElementById(id);
const el = {
  front: $("front"), back: $("back"), backBox: $("backContainer"),
  learnedTop: $("learnedChkTop"), hide: $("hideLearned"),
  frontSel: $("frontSelect"), count: $("count"), mix: $("mixChk"),
  headline: $("headlineAdd"), drawer: $("drawer"),
  listBox: $("listBox"), jumpSelect: $("jumpSelect")
};

/* ---- ヘルパー ---- */
function hasExt(u){ return /\.[a-z0-9]{2,5}(\?|$)/i.test(u||""); }
function isLocalLike(u){ if(!u) return false; if(/^https?:\/\//i.test(u)) return false; if(/^data:/i.test(u)) return false; return true; }
function resolveSozaiPath(u){
  if(!u) return ""; let s=String(u).trim(); if(!s) return s;
  s = s.replace(/^[\s,;:()［］【】「」『』“”'"。．、]+|[\s,;:()［］【】「」『』“”'"。．、]+$/g, "");
  if(!isLocalLike(s)) return s;
  if(s.includes("sozai/")) s = s.split("/").pop();
  if(hasExt(s) && !s.startsWith("./") && !s.startsWith("../") && !s.startsWith("/")) return SOZAI_BASE_URL + encodeURIComponent(s);
  return s;
}
function isVideoUrl(u){ return /\.(mp4|webm|ogg|mkv)(\?|$)/i.test(u||""); }
function isAudioUrl(u){ return /\.(mp3|m4a|aac|wav|ogg|opus)(\?|$)/i.test(u||""); }
function isHttpUrl(u){ return /^https?:\/\//i.test(u || ""); }
function baseName(u){ try{const x=(u||"").split("#")[0].split("?")[0]; return x.split("/").pop()||x;}catch(_){return u;} }
function isYouTubeUrl(u){ return /(youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/shorts\/)/i.test(u||""); }
function parseYouTubeId(u){ const m=(u||"").match(/(?:v=|youtu\.be\/|shorts\/)([A-Za-z0-9_-]{6,})/); return m?m[1]:null; }
function parseStartSeconds(u){
  try{const url=new URL(u,location.origin);const t=url.searchParams.get("t"),st=url.searchParams.get("start");
    const toSec=s=>{if(!s)return 0;if(/^\d+$/.test(s))return +s;let sec=0;const m=s.match(/(?:(\d+)h)?(?:(\d+)m)?(?:(\d+)s)?/i);
      if(m){if(m[1])sec+=+m[1]*3600;if(m[2])sec+=+m[2]*60;if(m[3])sec+=+m[3]} return sec;};
    return st?toSec(st):toSec(t);
  }catch{return 0;}
}
function ytEmbedUrl(u){const id=parseYouTubeId(u); if(!id) return ""; const s=parseStartSeconds(u); const p=new URLSearchParams(); if(s)p.set("start",String(s));
  p.set("modestbranding","1"); p.set("rel","0"); p.set("playsinline","1");
  return `https://www.youtube-nocookie.com/embed/${id}${p.toString()?"?"+p.toString():""}`;}
function ytWatchUrl(u){const id=parseYouTubeId(u); if(!id)return u; const s=parseStartSeconds(u); const p=new URLSearchParams(); p.set("v",id); if(s)p.set("t",String(s)); return `https://www.youtube.com/watch?${p.toString()}`;}
function ytThumbUrl(u){ const id=parseYouTubeId(u); return id?`https://i.ytimg.com/vi/${id}/hqdefault.jpg`:""; }
function normalizeDrive(u){
  if(!u) return "";
  const first=String(u).trim().split(/[\s\n]+/)[0];
  const pats=[/drive\.google\.com\/file\/d\/([A-Za-z0-9_-]{10,})/,/drive\.google\.com\/open\?id=([A-Za-z0-9_-]{10,})/,/docs\.google\.com\/.*?\/d\/([A-Za-z0-9_-]{10,})/,/drive\.google\.com\/uc\?.*?id=([A-Za-z0-9_-]{10,})/];
  for(const p of pats){ const m=first.match(p); if(m) return `https://drive.google.com/uc?export=download&id=${m[1]}`; }
  if(first.includes("/uc?export=download&id=")) return first; return first;
}
function isGooglePhotosUrl(u){ return /photos\.google\.com|photos\.app\.goo\.gl/i.test(u||""); }
function isImageUrl(u){
  if(!u) return false;
  const l=u.toLowerCase();
  return /\.(png|jpe?g|gif|webp|svg|bmp)(\?|$)/.test(l) ||
         l.includes("googleusercontent.com") || l.includes("/uc?export=download&id=") ||
         l.includes("lh3.google") || l.includes("imgur.com") || l.includes("gyazo.com");
}
function urlize(text){
  const re=/(https?:\/\/[^\s]+)/g; const frag=document.createDocumentFragment();
  let last=0,m; while((m=re.exec(text))!==null){ if(m.index>last) frag.append(document.createTextNode(text.slice(last,m.index)));
    const a=document.createElement("a"); a.href=m[0]; a.textContent=m[0]; a.target="_blank"; a.rel="noopener"; a.className="inline"; frag.append(a); last=re.lastIndex; }
  if(last<text.length) frag.append(document.createTextNode(text.slice(last)));
  return frag;
}

/* 表面列 */
function pickInitialFront(headers){
  const saved=localStorage.getItem(FRONT_STORE_KEY);
  if(saved && headers.includes(saved)) return saved;
  for(const c of FRONT_PREFER){ if(headers.includes(c)) return c; }
  return headers[0] || "";
}

/* 表示対象と順序 */
function rebuildView(){
  const frontKey=el.frontSel.value;
  rowsView = rowsAll.filter(row => {
    const v = String(row[frontKey] ?? "");
    return el.hide.checked ? !isLearn(v) : true;
  });
  buildOrder();
  if(order.length===0) idx=0; else if(idx>=order.length) idx=order.length-1;
  el.count.textContent = `${order.length ? idx+1 : 0} / ${order.length}`;
  rebuildDrawer();
}
function buildOrder(){
  order = rowsView.map((_,i)=>i);
  if(el.mix.checked){
    for(let i=order.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [order[i],order[j]]=[order[j],order[i]]; }
  }
}

/* YouTube描画 */
function renderYouTube(sec, url){
  const embed=ytEmbedUrl(url), watch=ytWatchUrl(url), thumb=ytThumbUrl(url);
  if(YT_MODE==="link" || !embed){
    const fb=document.createElement("div"); fb.className="yt-fallback";
    if(thumb){ const img=document.createElement("img"); img.src=thumb; img.alt="YouTube Thumbnail"; img.loading="lazy"; fb.appendChild(img); }
    const a=document.createElement("a"); a.href=watch; a.target="_blank"; a.rel="noopener"; a.className="play"; a.innerHTML="▶ YouTubeで再生"; fb.appendChild(a);
    const hint=document.createElement("div"); hint.className="hint"; hint.textContent="クリックで開く"; fb.appendChild(hint);
    sec.appendChild(fb); return;
  }
  const box=document.createElement("div"); box.className="yt";
  const ifr=document.createElement("iframe"); ifr.src=embed; ifr.loading="lazy";
  ifr.allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";
  ifr.setAttribute("allowfullscreen","");
  box.appendChild(ifr); sec.appendChild(box);
  const under=document.createElement("div"); under.className="muted"; under.style.marginTop="6px";
  const link=document.createElement("a"); link.href=watch; link.target="_blank"; link.rel="noopener"; link.textContent="YouTubeで開く"; link.className="inline";
  under.appendChild(link); sec.appendChild(under);
}

/* 裏面描画 */
function renderBack(row){
  el.backBox.innerHTML="";
  const frontKey=el.frontSel.value;
  headers.forEach(key=>{
    if(key===frontKey) return;
    const raw=row[key]; if(!raw) return;

    const sec=document.createElement("div"); sec.className="section";
    const title=document.createElement("p"); title.className="sec-title"; title.textContent=key; sec.appendChild(title);

    const val=String(raw).trim();
    const tokens=val.split(/[\n,、]+|\t+/).map(s=>s.trim()).filter(Boolean);
    let hasMedia=false, remainingText=val;

    tokens.forEach(tok=>{
      if(!tok) return;
      let resolved=resolveSozaiPath(tok);

      if(isYouTubeUrl(resolved)){ renderYouTube(sec,resolved); hasMedia=true; remainingText=remainingText.replace(tok,"").trim(); return; }
      if(isGooglePhotosUrl(resolved)){
        const img=document.createElement("img"); img.className="cardimg"; img.src=getGooglePhotosDirectUrl(resolved); img.alt=key; img.loading="lazy";
        img.onerror=function(){ this.style.display='none'; const err=document.createElement("div"); err.innerHTML=`[画像を表示できません] <a href="${resolved}" target="_blank">リンク</a>`; err.style.color="#999"; err.style.fontSize="12px"; this.parentNode.insertBefore(err,this); };
        sec.appendChild(img); hasMedia=true; remainingText=remainingText.replace(tok,"").trim(); return;
      }
      if(isHttpUrl(resolved)) resolved=normalizeDrive(resolved);

      if(isImageUrl(resolved)){
        const img=document.createElement("img"); img.className="cardimg"; img.src=resolved; img.alt=key; img.loading="lazy";
        img.onerror=function(){ this.style.display='none'; const err=document.createElement("div"); err.innerHTML=`[画像を表示できません] <a href="${resolved}" target="_blank">リンク</a>`; err.style.color="#999"; err.style.fontSize="12px"; this.parentNode.insertBefore(err,this); };
        sec.appendChild(img); hasMedia=true; remainingText=remainingText.replace(tok,"").trim(); return;
      }
      if(isAudioUrl(resolved)){
        const audio=document.createElement("audio"); audio.controls=true; audio.src=resolved;
        audio.addEventListener("play",()=>{ if(lastAudio && lastAudio!==audio) lastAudio.pause(); lastAudio=audio; });
        sec.appendChild(audio); const cap=document.createElement("div"); cap.className="muted"; cap.textContent=baseName(resolved); sec.appendChild(cap);
        hasMedia=true; remainingText=remainingText.replace(tok,"").trim(); return;
      }
      if(isVideoUrl(resolved)){
        const video=document.createElement("video"); video.controls=true; video.src=resolved; video.style.width="100%"; video.style.margin="8px 0";
        sec.appendChild(video); const cap=document.createElement("div"); cap.className="muted"; cap.textContent=baseName(resolved); sec.appendChild(cap);
        hasMedia=true; remainingText=remainingText.replace(tok,"").trim(); return;
      }
    });

    if(remainingText && remainingText.trim()){
      const body=document.createElement("div"); body.className="sec-body";
      if(remainingText.includes("http")) body.appendChild(urlize(remainingText)); else body.textContent=remainingText;
      sec.appendChild(body);
    }
    if(!hasMedia && !remainingText.trim() && val){
      const body=document.createElement("div"); body.className="sec-body"; body.appendChild(urlize(val)); sec.appendChild(body);
    }
    el.backBox.appendChild(sec);
  });
}

/* 表示 */
function render(){
  if(order.length===0){
    el.front.textContent="表示できるカードがありません";
    el.back.style.display="none"; el.front.style.display="block";
    el.learnedTop.checked=false; el.count.textContent=`0 / 0`; return;
  }
  const frontKey=el.frontSel.value;
  const row=rowsView[order[idx]];
  const word=String(row[frontKey]??"(no value)");
  if(showBack){ el.front.style.display="none"; el.back.style.display="block"; renderBack(row); el.learnedTop.checked=isLearn(word); }
  else{ el.back.style.display="none"; el.front.style.display="block"; el.front.textContent=word; }
  el.count.textContent=`${idx+1} / ${order.length}`;
  highlightInDrawer(order[idx]);
}

/* ナビ（表裏1セット） */
function next(){ if(!order.length) return; if(!showBack){showBack=true;render();} else {showBack=false; idx=(idx+1)%order.length; render();} }
function prev(){ if(!order.length) return; if(showBack){showBack=false;render();} else {showBack=true; idx=(idx-1+order.length)%order.length; render();} }

/* 左サイドバー：リスト生成 */
function getHeadlineIdxList(){
  try{ return JSON.parse(localStorage.getItem(HEAD_STORE_KEY)||"[]"); }catch{ return []; }
}
function addHeadline(currentAbsIndex){
  const arr=new Set(getHeadlineIdxList());
  arr.add(currentAbsIndex);
  localStorage.setItem(HEAD_STORE_KEY, JSON.stringify([...arr].sort((a,b)=>a-b)));
}
function rebuildDrawer(){
  // Jump select（50ごと + 見出し）
  const total = rowsAll.length;
  const heads = getHeadlineIdxList().filter(i => i>=0 && i<total);
  el.jumpSelect.innerHTML="";
  for(let i=0;i<total;i+=50){
    const w = String(rowsAll[i][el.frontSel.value] ?? "");
    const opt=document.createElement("option"); opt.value=String(i); opt.textContent=`${i+1}: ${w}`; el.jumpSelect.appendChild(opt);
  }
  heads.forEach(i=>{
    const w = String(rowsAll[i][el.frontSel.value] ?? "");
    const opt=document.createElement("option"); opt.value=String(i); opt.textContent=`★ ${i+1}: ${w}`; el.jumpSelect.appendChild(opt);
  });

  // 単語リスト（表示対象のみ。覚えたはグレー）
  el.listBox.innerHTML="";
  rowsView.forEach((row,vi)=>{
    const w=String(row[el.frontSel.value] ?? "");
    const div=document.createElement("div"); div.className="word"; div.textContent=`${vi+1}. ${w}`;
    if(isLearn(w)) div.classList.add("learned");
    div.addEventListener("click", ()=>{ idx=vi; showBack=false; render(); closeDrawer(); });
    el.listBox.appendChild(div);
  });
}
function highlightInDrawer(vi){
  const nodes=[...el.listBox.querySelectorAll(".word")];
  nodes.forEach(n=>n.classList.remove("active"));
  const node=nodes[vi]; if(node){ node.classList.add("active"); node.scrollIntoView({block:"nearest"}); }
}
function openDrawer(){ el.drawer.classList.add("open"); el.drawer.setAttribute("aria-hidden","false"); }
function closeDrawer(){ el.drawer.classList.remove("open"); el.drawer.setAttribute("aria-hidden","true"); }

/* データ取得 */
async function load(){
  try{
    if (!SHEET) { el.front.textContent = "URLに ?sheet=シート名 を指定してください"; return; }
    const url = API_URL + encodeURIComponent(SHEET) + ".json";
    const res = await fetch(url, {cache:"no-store"});
    if (!res.ok) throw new Error(`JSONの読み込み失敗: ${res.status} ${res.statusText}`);
    rowsAll = await res.json();
    headers = rowsAll.length ? Object.keys(rowsAll[0]) : [];

    el.frontSel.innerHTML=""; headers.forEach(k=>{ const o=document.createElement("option"); o.value=k; o.textContent=k; el.frontSel.appendChild(o); });
    const initial = pickInitialFront(headers); el.frontSel.value=initial; localStorage.setItem(FRONT_STORE_KEY, initial);

    rebuildView(); idx=0; showBack=false; render();
  }catch(e){ el.front.textContent = `取得エラー: ${e.message}`; console.error(e); }
}

/* イベント */
$("prevBtn").addEventListener("click", prev);
$("nextBtn").addEventListener("click", next);
$("topBtn").addEventListener("click", ()=>{ location.href="index.html"; });
$("listBtn").addEventListener("click", openDrawer);
$("closeDrawer").addEventListener("click", closeDrawer);
$("jumpGo").addEventListener("click", ()=>{
  const abs = parseInt(el.jumpSelect.value||"0",10);
  // abs(全体) → 表示中インデックスに変換
  const frontKey=el.frontSel.value;
  const targetWord = String(rowsAll[abs][frontKey] ?? "");
  const vi = rowsView.findIndex(r => String(r[frontKey] ?? "") === targetWord);
  if(vi>=0){ idx=vi; showBack=false; render(); }
  closeDrawer();
});

el.learnedTop.addEventListener("change", ()=>{
  if(!order.length) return;
  const w=String(rowsView[order[idx]][el.frontSel.value] ?? "");
  setLearn(w, el.learnedTop.checked);
  if(el.hide.checked){ rebuildView(); idx=0; showBack=false; }
  render();
});
el.hide.addEventListener("change", ()=>{ rebuildView(); render(); });
el.mix.addEventListener("change", ()=>{ buildOrder(); idx=0; showBack=false; render(); });
el.frontSel.addEventListener("change", ()=>{ localStorage.setItem(FRONT_STORE_KEY, el.frontSel.value); rebuildView(); idx=0; showBack=false; render(); });
el.headline.addEventListener("change", ()=>{
  if(!order.length){ el.headline.checked=false; return; }
  const absIndex = rowsAll.findIndex(r => String(r[el.frontSel.value] ?? "") === String(rowsView[order[idx]][el.frontSel.value] ?? ""));
  if(absIndex>=0) addHeadline(absIndex);
  el.headline.checked=false; rebuildDrawer();
});

/* 初期化 */
load();
</script>
</body>
</html>
