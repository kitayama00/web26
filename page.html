<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<title>Card</title>
<!-- iOSダブルタップ拡大を抑止し、スマホで1行収まるように -->
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<style>
  /* =========================
     # コンセプト / 学習者向け注釈
     ・上バーは1行固定。右に入り切らない場合は横スクロール可
     ・下バーは控えめな薄グレー＋白文字。iOSのダブルタップ拡大を抑止
     ・左サイドはページのA列（単語）だけを常に表示。Learnedはグレー
     ・ジャンプは「50,100,…」＋「見」チェックで追加した見出しを即移動
     ・OK=既習/非=既習非表示/交=クロス（フリップ→次をランダム）/見=見出し追加
     ・ボタンサイズは下のCSS変数を調整
     ========================= */

  /* ここを変えると全体の余白・ボタンサイズが変わります */
  :root{
    --pad:12px;                 /* ページ余白 */
    --pill-h: 30px;             /* 上バーの高さ */
    --nav-btn-w: 140px;         /* 下ボタンの横幅 */
    --nav-btn-h: 44px;          /* 下ボタンの高さ */
    --side-w: 300px;            /* 左リスト幅（スマホは自動で縮む） */
    --side-row-gap: 1px;        /* 左リスト行間（さらに詰めたい時は 0px） */
    --side-row-pad-v: 2px;      /* 左リストの上下パディング（最小 1px 推奨） */
  }

  *{ box-sizing: border-box; }
  body{
    font-family: system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans JP",sans-serif;
    margin:0;
    background:#0f1318;   /* 自動ダーク相当 */
    color:#e8eaee;
    padding-bottom:80px;  /* 下バーぶんの余白 */
  }

  /* 上バー：細身＋薄い境界線、1行・横スクロール */
  header{
    position:sticky; top:0; z-index:30;
    padding:6px var(--pad);
    background:#0f1318cc;
    backdrop-filter: blur(4px);
    border-bottom:1px solid rgba(255,255,255,.12);
  }
  .topbar{
    display:flex; align-items:center; gap:8px;
    overflow-x:auto; white-space:nowrap; scrollbar-width:thin;
  }
  .count{ opacity:.75; }
  .btn, .pill, .chk{
    height: var(--pill-h);
    border-radius: 12px;
    border:1px solid rgba(255,255,255,.16);
    background:#1a1f27; color:#e8eaee;
    font-size:13px;
  }
  .btn{ padding:0 10px; cursor:pointer; touch-action:manipulation; }
  .pill{ padding:0 22px 0 8px; }
  .chk{ display:inline-flex; align-items:center; gap:6px; padding:0 8px; }
  .chk input{ width:16px; height:16px; }

  /* 左サイド：A列（単語）固定表示。Learnedは半透明。 */
  .side{
    position:fixed; inset:40px auto 80px 0;
    width:var(--side-w); max-width:90vw;
    transform: translateX(-100%);
    transition: transform .2s ease;
    background:#10151c;
    border-right:1px solid rgba(255,255,255,.12);
    z-index:20; padding:8px;
  }
  .side.open{ transform:none; }
  .side-head{ display:flex; align-items:center; gap:6px; }
  .side-title{ font-weight:700; font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .grow{ flex:1; }
  .side-select{
    height:26px; border:1px solid rgba(255,255,255,.16);
    background:#1a1f27; color:#e8eaee; border-radius:10px; padding:0 10px;
  }
  .list{ margin-top:6px; display:flex; flex-direction:column; gap: var(--side-row-gap); }
  .row{
    padding: var(--side-row-pad-v) 8px; font-size:13px; border-radius:8px; cursor:pointer;
    border:1px solid transparent; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .row.active{ background:#1d2734; border-color:#365a86; }
  .row.learned{ opacity:.45; }

  /* 本体カード */
  .wrap{ max-width:900px; margin:0 auto; padding:var(--pad); }
  .card{ border-radius:16px; }
  .front{ font-size:clamp(24px,6vw,38px); font-weight:800; white-space:pre-wrap; }
  .back .section{ margin:10px 0; }
  .sec-title{ font-size:12px; opacity:.65; margin:0 0 4px; }
  .sec-body{ font-size:15px; line-height:1.6; white-space:pre-wrap; word-break:break-word; }
  img.cardimg{
    width:100%; height:auto; border:1px solid #2a3442; border-radius:10px;
    object-fit:contain; background:#0c0f13; margin:8px 0; max-height:400px;
  }
  a.inline{ color:#8fb3ff; word-break:break-all; text-decoration:none; }
  a.inline:hover{ text-decoration:underline; }

  /* 下ナビ：薄グレー枠＋白抜き文字、スマホでも見やすく */
  footer.nav{
    position:fixed; left:0; right:0; bottom:0; z-index:25;
    padding:8px 10px;
    background:#0f1318cc; backdrop-filter: blur(4px);
    border-top:1px solid rgba(255,255,255,.12);
    display:flex; gap:10px; justify-content:center;
  }
  .navbtn{
    min-width: var(--nav-btn-w); height: var(--nav-btn-h);
    border-radius:12px; font-weight:700; font-size:16px;
    background: transparent; color:#fff;
    border:1px solid rgba(255,255,255,.55);
    touch-action: manipulation; cursor:pointer;
    -webkit-user-select:none; user-select:none;
  }

  @media (max-width:520px){
    .navbtn{ min-width:130px; height:42px; font-size:15px; }
  }
</style>
</head>
<body>
<header>
  <!-- 上バー：順序＝「1/4・List・Top・表・OK/非/交/見」 -->
  <div class="topbar">
    <div id="count" class="count">0/0</div>
    <button id="listBtn" class="btn">List</button>
    <button id="topBtn" class="btn" onclick="location.href='index.html'">Top</button>
    <select id="frontSelect" class="pill"></select>
    <label class="chk"><input type="checkbox" id="okChk">OK</label>
    <label class="chk"><input type="checkbox" id="hideChk" checked>非</label>
    <label class="chk"><input type="checkbox" id="crossChk">交</label>
    <label class="chk"><input type="checkbox" id="headChk">見</label>
  </div>
</header>

<!-- 左ページリスト：A列固定。ジャンプは即移動。 -->
<aside id="sidebar" class="side">
  <div class="side-head">
    <div id="sideTitle" class="side-title">ページ</div>
    <div class="grow"></div>
    <select id="jumpHead" class="side-select" title="Jump"></select>
    <button id="closeSide" class="btn" style="height:26px;padding:0 8px">Close</button>
  </div>
  <div id="sideList" class="list"></div>
</aside>

<div class="wrap">
  <div class="card" id="card">
    <div id="front" class="front">読み込み中…</div>
    <div id="back" class="back" style="display:none">
      <div id="backContainer"></div>
    </div>
  </div>
</div>

<footer class="nav">
  <button id="prevBtn" class="navbtn">◀ 前</button>
  <button id="nextBtn" class="navbtn">次 ▶</button>
</footer>

<script>
/* =========================
   設定
   ・indexを経由しない直リンクでもページ名を出すため ?title= を併用可能
   ========================= */
const API_URL = "https://storage.googleapis.com/works2511-f9693.firebasestorage.app/cards/";
const SOZAI_BASE_URL = API_URL + "sozai/";
const FRONT_PREFER = ["英単語","単語","word","Word"];
const YT_MODE = (location.protocol === "file:") ? "link" : "auto";

const SHEET = new URLSearchParams(location.search).get("sheet") || "";
const PAGE_TITLE_Q = new URLSearchParams(location.search).get("title") || "";
const PAGE_NAME = PAGE_TITLE_Q || SHEET || document.title;
document.title = PAGE_NAME;

/* LocalStorage Keys */
const KEY_PREFIX = `cards:${SHEET}:`;
const FRONT_STORE_KEY = `cards:${SHEET}:frontCol`;
const HEADS_KEY = `cards:${SHEET}:heads`;     // 「見」で追加した手動見出し（index配列）
const LEARN_KEY = w => `${KEY_PREFIX}${w}`;

/* State */
let rowsAll = [], headers = [], rowsView = [];
let idx = 0, showBack = false, lastAudio = null;
let baseKey = "";                // A列（単語）キー
let headMarks = [];              // 見出しindex配列
let crossQueue = [];             // 交モードのシャッフル順
let crossPtr = 0;

const $ = id => document.getElementById(id);
const el = {
  front: $("front"),
  back: $("back"),
  backBox: $("backContainer"),
  frontSel: $("frontSelect"),
  count: $("count"),
  side: $("sidebar"),
  sideTitle: $("sideTitle"),
  sideList: $("sideList"),
  jump: $("jumpHead"),
  ok: $("okChk"),
  hide: $("hideChk"),
  cross: $("crossChk"),
  head: $("headChk"),
  prev: $("prevBtn"),
  next: $("nextBtn")
};

/* ===== ユーティリティ ===== */
const isLearn = w => localStorage.getItem(LEARN_KEY(w)) === "1";
const setLearn = (w,v) => v ? localStorage.setItem(LEARN_KEY(w),"1") : localStorage.removeItem(LEARN_KEY(w));
const saveHeads = () => localStorage.setItem(HEADS_KEY, JSON.stringify(headMarks));
const loadHeads = () => {
  try { headMarks = JSON.parse(localStorage.getItem(HEADS_KEY)||"[]") || []; }
  catch { headMarks = []; }
};

function hasExt(u){ return /\.[a-z0-9]{2,5}(\?|$)/i.test(u||""); }
function isLocalLike(u){
  if(!u) return false;
  if(/^https?:\/\//i.test(u)) return false;
  if(/^data:/i.test(u)) return false;
  return true;
}
function resolveSozaiPath(u){
  if(!u) return "";
  let s = String(u).trim();
  if(!s) return s;
  s = s.replace(/^[\s,;:()［］【】「」『』“”'"。．、]+|[\s,;:()［］【】「」『』“”'"。．、]+$/g, "");
  if(!isLocalLike(s)) return s;
  if(s.includes("sozai/")) s = s.split("/").pop();
  if(hasExt(s) && !s.startsWith("./") && !s.startsWith("../") && !s.startsWith("/")){
    return SOZAI_BASE_URL + encodeURIComponent(s);
  }
  return s;
}
function isVideoUrl(u){ return /\.(mp4|webm|ogg|mkv)(\?|$)/i.test(u||""); }
function isAudioUrl(u){ return /\.(mp3|m4a|aac|wav|ogg|opus)(\?|$)/i.test(u||""); }
function isHttpUrl(u){ return /^https?:\/\//i.test(u || ""); }
function baseName(u){
  try{
    const x = (u||"").split("#")[0].split("?")[0];
    return x.split("/").pop() || x;
  }catch(_){ return u; }
}
function urlize(text){
  const re = /(https?:\/\/[^\s]+)/g;
  const frag = document.createDocumentFragment();
  let last = 0, m;
  while((m = re.exec(text)) !== null){
    if(m.index > last) frag.append(document.createTextNode(text.slice(last, m.index)));
    const a = document.createElement("a");
    a.href = m[0]; a.textContent = m[0];
    a.target = "_blank"; a.rel = "noopener"; a.className = "inline";
    frag.append(a);
    last = re.lastIndex;
  }
  if(last < text.length) frag.append(document.createTextNode(text.slice(last)));
  return frag;
}

/* ===== YouTube ===== */
function isYouTubeUrl(u){ return /(youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/shorts\/)/i.test(u||""); }
function parseYouTubeId(u){
  if(!u) return null;
  const m = u.match(/(?:v=|youtu\.be\/|shorts\/)([A-Za-z0-9_-]{6,})/);
  return m ? m[1] : null;
}
function parseStartSeconds(u){
  try{
    const url = new URL(u, location.origin);
    const t = url.searchParams.get("t");
    const start = url.searchParams.get("start");
    const toSec = (str)=>{
      if(!str) return 0;
      if(/^\d+$/.test(str)) return parseInt(str,10);
      let sec = 0;
      const m = str.match(/(?:(\d+)h)?(?:(\d+)m)?(?:(\d+)s)?/i);
      if(m){ if(m[1]) sec += +m[1]*3600; if(m[2]) sec += +m[2]*60; if(m[3]) sec += +m[3]; }
      return sec;
    };
    return start ? toSec(start) : toSec(t);
  }catch{ return 0; }
}
function ytEmbedUrl(u){
  const id = parseYouTubeId(u);
  if(!id) return "";
  const start = parseStartSeconds(u);
  const params = new URLSearchParams();
  if(start) params.set("start", String(start));
  params.set("modestbranding","1"); params.set("rel","0"); params.set("playsinline","1");
  return `https://www.youtube-nocookie.com/embed/${id}${params.toString()?"?"+params.toString():""}`;
}
function ytWatchUrl(u){
  const id = parseYouTubeId(u);
  if(!id) return u;
  const start = parseStartSeconds(u);
  const p = new URLSearchParams(); p.set("v", id); if(start) p.set("t", String(start));
  return `https://www.youtube.com/watch?${p.toString()}`;
}
function ytThumbUrl(u){
  const id = parseYouTubeId(u);
  return id ? `https://i.ytimg.com/vi/${id}/hqdefault.jpg` : "";
}
function renderYouTube(sec, urlOriginal){
  const embed = ytEmbedUrl(urlOriginal);
  const watch = ytWatchUrl(urlOriginal);
  const thumb = ytThumbUrl(urlOriginal);
  if(YT_MODE === "link" || !embed){
    const fb = document.createElement("div");
    fb.className = "yt-fallback";
    if(thumb){
      const img = document.createElement("img");
      img.src = thumb; img.alt = "YouTube Thumbnail"; img.loading = "lazy";
      fb.appendChild(img);
    }
    const a = document.createElement("a");
    a.href = watch; a.target = "_blank"; a.rel = "noopener"; a.className = "inline";
    a.textContent = "▶ YouTubeで開く";
    fb.appendChild(a);
    sec.appendChild(fb);
    return;
  }
  const box = document.createElement("div"); box.style.position="relative"; box.style.width="100%"; box.style.aspectRatio="16/9";
  const iframe = document.createElement("iframe");
  iframe.src = embed; iframe.loading = "lazy";
  iframe.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";
  iframe.setAttribute("allowfullscreen", "");
  iframe.style.position="absolute"; iframe.style.inset="0"; iframe.style.width="100%"; iframe.style.height="100%"; iframe.style.border="0";
  box.appendChild(iframe);
  const under = document.createElement("div"); under.className="sec-body"; under.style.opacity=".7";
  const link = document.createElement("a"); link.href = watch; link.target="_blank"; link.rel="noopener"; link.textContent="YouTubeで開く"; link.className="inline";
  under.appendChild(link);
  sec.appendChild(box); sec.appendChild(under);
}

/* ===== 裏面描画 ===== */
function isGooglePhotosUrl(u){ return /photos\.google\.com|photos\.app\.goo\.gl/i.test(u || ""); }
function extractGooglePhotosId(url){
  const m1 = url.match(/\/photo\/(AF1Qip[A-Za-z0-9_-]+)/);
  if(m1) return m1[1];
  const m2 = url.match(/photos\.app\.goo\.gl\/([A-Za-z0-9]+)/);
  if(m2) return m2[1];
  return null;
}
function getGooglePhotosDirectUrl(url){
  const id = extractGooglePhotosId(url);
  if(id && id.startsWith("AF1Qip")) return `https://lh3.googleusercontent.com/pw/${id}=w800`;
  return url;
}
function normalizeDrive(u){
  if(!u) return "";
  const first = String(u).trim().split(/[\s\n]+/)[0];
  const pats = [
    /drive\.google\.com\/file\/d\/([A-Za-z0-9_-]{10,})/,
    /drive\.google\.com\/open\?id=([A-Za-z0-9_-]{10,})/,
    /docs\.google\.com\/.*?\/d\/([A-Za-z0-9_-]{10,})/,
    /drive\.google\.com\/uc\?.*?id=([A-Za-z0-9_-]{10,})/
  ];
  for(const p of pats){
    const m = first.match(p);
    if(m) return `https://drive.google.com/uc?export=download&id=${m[1]}`;
  }
  if(first.includes("/uc?export=download&id=")) return first;
  return first;
}

function renderBack(row){
  el.backBox.innerHTML = "";
  const frontKey = el.frontSel.value;

  headers.forEach(key => {
    if(key === frontKey) return;
    const raw = row[key];
    if(!raw) return;

    const sec = document.createElement("div");
    sec.className = "section";
    const title = document.createElement("p");
    title.className = "sec-title";
    title.textContent = key;
    sec.appendChild(title);

    const val = String(raw).trim();
    const tokens = val.split(/[\n,、]+|\t+/).map(s => s.trim()).filter(Boolean);

    let hasMedia = false;
    let remainingText = val;

    tokens.forEach(tok => {
      if(!tok) return;
      let resolved = resolveSozaiPath(tok);

      if(isYouTubeUrl(resolved)){
        renderYouTube(sec, resolved);
        hasMedia = true; remainingText = remainingText.replace(tok,"").trim(); return;
      }
      if(isGooglePhotosUrl(resolved)){
        const img = document.createElement("img");
        img.className="cardimg"; img.src=getGooglePhotosDirectUrl(resolved); img.alt=key; img.loading="lazy";
        img.onerror=function(){
          this.style.display="none";
          const err=document.createElement("div");
          err.innerHTML=`[画像を表示できません] <a href="${resolved}" target="_blank">リンク</a>`;
          err.style.color="#9aa7b8"; err.style.fontSize="12px";
          this.parentNode.insertBefore(err,this);
        };
        sec.appendChild(img); hasMedia=true; remainingText=remainingText.replace(tok,"").trim(); return;
      }
      if(isHttpUrl(resolved)) resolved = normalizeDrive(resolved);
      if(/\.(png|jpe?g|gif|webp|svg|bmp)(\?|$)/i.test((resolved||"").toLowerCase())){
        const img = document.createElement("img");
        img.className="cardimg"; img.src=resolved; img.alt=key; img.loading="lazy";
        img.onerror=function(){
          this.style.display="none";
          const err=document.createElement("div");
          err.innerHTML=`[画像を表示できません] <a href="${resolved}" target="_blank">リンク</a>`;
          err.style.color="#9aa7b8"; err.style.fontSize="12px";
          this.parentNode.insertBefore(err,this);
        };
        sec.appendChild(img); hasMedia=true; remainingText=remainingText.replace(tok,"").trim(); return;
      }
      if(isAudioUrl(resolved)){
        const audio=document.createElement("audio");
        audio.controls=true; audio.src=resolved;
        audio.addEventListener("play",()=>{ if(lastAudio && lastAudio!==audio) lastAudio.pause(); lastAudio=audio; });
        sec.appendChild(audio);
        const cap=document.createElement("div"); cap.className="sec-body"; cap.style.opacity=".7"; cap.textContent=baseName(resolved);
        sec.appendChild(cap); hasMedia=true; remainingText=remainingText.replace(tok,"").trim(); return;
      }
      if(isVideoUrl(resolved)){
        const video=document.createElement("video");
        video.controls=true; video.src=resolved; video.style.width="100%"; video.style.margin="8px 0";
        sec.appendChild(video);
        const cap=document.createElement("div"); cap.className="sec-body"; cap.style.opacity=".7"; cap.textContent=baseName(resolved);
        sec.appendChild(cap); hasMedia=true; remainingText=remainingText.replace(tok,"").trim(); return;
      }
    });

    if(remainingText && remainingText.trim()){
      const body=document.createElement("div");
      body.className="sec-body";
      if(remainingText.includes("http")) body.appendChild(urlize(remainingText));
      else body.textContent=remainingText;
      sec.appendChild(body);
    }

    if(!hasMedia && !remainingText.trim() && val){
      const body=document.createElement("div");
      body.className="sec-body"; body.appendChild(urlize(val)); sec.appendChild(body);
    }

    el.backBox.appendChild(sec);
  });
}

/* ===== ビュー構築・描画 ===== */
function rebuildView(){
  const frontKey = el.frontSel.value;
  rowsView = rowsAll.filter(row => {
    const w = String(row[baseKey] ?? "");
    return el.hide.checked ? !isLearn(w) : true;
  });
  if(rowsView.length === 0) idx = 0;
  else if(idx >= rowsView.length) idx = rowsView.length - 1;
  el.count.textContent = `${rowsView.length ? idx+1 : 0}/${rowsView.length}`;
  // 交モードのキューも再構築
  buildCrossQueue();
  renderSideList();
}

function render(){
  if(rowsView.length===0){
    el.front.textContent="表示できるカードがありません";
    el.back.style.display="none"; el.front.style.display="block";
    el.count.textContent=`0/0`;
    return;
  }
  const frontKey=el.frontSel.value;
  const row=rowsView[idx];
  const word=String(row[baseKey]??"");
  const frontText=String(row[frontKey]??"(no value)");

  if(showBack){
    el.front.style.display="none"; el.back.style.display="block";
    renderBack(row);
    // OKチェック状態を同期
    el.ok.checked = isLearn(word);
  }else{
    el.back.style.display="none"; el.front.style.display="block";
    el.front.textContent=frontText; // ←固定で残る細い行はこれで上書きされるだけ。追加DOMは出していない
  }
  el.count.textContent=`${idx+1}/${rowsView.length}`;
  highlightActiveInList();
}

/* ===== 左リスト（A列固定） ===== */
function renderSideList(){
  el.sideTitle.textContent = PAGE_NAME || "ページ";
  el.sideList.innerHTML = "";

  // ジャンプセレクト（即移動）
  const opts = [];
  // 50刻み
  for(let i=50; i<=rowsAll.length; i+=50){
    const w = String(rowsAll[i-1]?.[baseKey] ?? "");
    opts.push({label: `${i}:${w}`, index: i-1});
  }
  // 手動見出し
  headMarks
    .filter(i => i>=0 && i<rowsAll.length)
    .forEach(i => {
      const w = String(rowsAll[i][baseKey] ?? "");
      opts.push({label: `${i+1}:${w}`, index: i});
    });
  // 重複排除＋昇順
  const map = new Map();
  for(const o of opts) map.set(o.index, o);
  const final = Array.from(map.values()).sort((a,b)=>a.index-b.index);

  el.jump.innerHTML = "";
  const p0 = document.createElement("option");
  p0.value = ""; p0.textContent = "Jump";
  el.jump.appendChild(p0);
  final.forEach(o=>{
    const op = document.createElement("option");
    op.value = String(o.index);
    op.textContent = o.label.replace(/^No\./i,""); // 「No.」を消す
    el.jump.appendChild(op);
  });

  // リスト（A列のみ）
  const base = el.frontSel.value; // 表示はA列固定なので baseKey 使用
  rowsAll.forEach((r, i) => {
    const div = document.createElement("div");
    const w = String(r[baseKey] ?? "");
    div.className = "row" + (isLearn(w) ? " learned" : "");
    div.textContent = w || "(no word)";
    div.onclick = ()=>{ openByAbsoluteIndex(i); };
    el.sideList.appendChild(div);
  });

  highlightActiveInList();
}

function highlightActiveInList(){
  const nodes = el.sideList.querySelectorAll(".row");
  nodes.forEach((n,i)=> n.classList.toggle("active", absoluteIndexOfCurrent()===i));
}

function absoluteIndexOfCurrent(){
  // 現在の rowsView[idx] が rowsAll の何番目か
  if(!rowsView.length) return 0;
  const r = rowsView[idx];
  const target = r[baseKey];
  return rowsAll.findIndex(x => x[baseKey]===target);
}

function openByAbsoluteIndex(absIndex){
  // absIndex を rowsView の idx にマップし直す
  const word = String(rowsAll[absIndex]?.[baseKey] ?? "");
  const viewIndex = rowsView.findIndex(r => String(r[baseKey]??"")===word);
  if(viewIndex>=0){
    idx = viewIndex;
    showBack = false;
    render();
    if(!el.side.classList.contains("open")){} // そのまま
  }else{
    // 非表示により見つからない時は hide を外して移動
    el.hide.checked = false;
    rebuildView();
    const vi2 = rowsView.findIndex(r => String(r[baseKey]??"")===word);
    if(vi2>=0){ idx = vi2; showBack=false; render(); }
  }
}

/* ===== 交モード（シャッフル） ===== */
function buildCrossQueue(){
  if(!el.cross.checked || rowsView.length===0){
    crossQueue = []; crossPtr = 0; return;
  }
  const arr = [...Array(rowsView.length).keys()];
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
  crossQueue = arr;
  crossPtr = crossQueue.indexOf(idx);
  if(crossPtr<0) crossPtr = 0;
}

/* ===== データロード ===== */
async function load(){
  try{
    if (!SHEET) { el.front.textContent = "URLに ?sheet=シート名 を指定してください"; return; }
    const jsonUrl = API_URL + encodeURIComponent(SHEET) + ".json";
    const res = await fetch(jsonUrl, {cache:"no-store"});
    if (!res.ok) throw new Error(`JSON取得失敗: ${res.status} ${res.statusText}`);

    const data = await res.json();
    rowsAll = data;
    headers = rowsAll.length ? Object.keys(rowsAll[0]) : [];
    baseKey = headers[0] || "";

    // 表のドロップダウン
    el.frontSel.innerHTML = "";
    headers.forEach(k => {
      const opt = document.createElement("option");
      opt.value = k; opt.textContent = k;
      el.frontSel.appendChild(opt);
    });
    const saved = localStorage.getItem(FRONT_STORE_KEY);
    const initial = (saved && headers.includes(saved)) ? saved : (FRONT_PREFER.find(c=>headers.includes(c)) || headers[0] || "");
    el.frontSel.value = initial;
    localStorage.setItem(FRONT_STORE_KEY, initial);

    loadHeads();
    rebuildView();
    idx = 0; showBack = false;
    render();
  } catch(e){
    el.front.textContent = `取得エラー: ${e.message}`;
    console.error(e);
  }
}

/* ===== イベント ===== */
$("listBtn").addEventListener("click", ()=> el.side.classList.add("open"));
$("closeSide").addEventListener("click", ()=> el.side.classList.remove("open"));

el.jump.addEventListener("change", (ev)=>{
  const v = ev.target.value;
  if(v==="") return;
  openByAbsoluteIndex(Number(v));
  // 選択即移動なので初期値へ戻す
  ev.target.value = "";
});

el.ok.addEventListener("change", ()=>{
  if(!rowsView.length) return;
  const w = String(rowsView[idx][baseKey] ?? "");
  setLearn(w, el.ok.checked);
  if(el.hide.checked){
    rebuildView();
    if(idx >= rowsView.length) idx = 0;
  }
  render();
});

el.hide.addEventListener("change", ()=>{
  rebuildView(); render();
});

el.cross.addEventListener("change", ()=>{
  buildCrossQueue();
});

el.head.addEventListener("change", ()=>{
  if(!rowsView.length) return;
  const abs = absoluteIndexOfCurrent();
  if(el.head.checked){
    if(!headMarks.includes(abs)) headMarks.push(abs);
  }else{
    headMarks = headMarks.filter(i=>i!==abs);
  }
  saveHeads();
  renderSideList();
});

el.frontSel.addEventListener("change", ()=>{
  localStorage.setItem(FRONT_STORE_KEY, el.frontSel.value);
  showBack = false;
  // 表示内容は frontSel に変わるが、左リストとジャンプはA列固定なのでそのまま
  render();
});

/* 下ナビ（交モードの挙動を含む） */
el.next.addEventListener("click", ()=>{
  if(!rowsView.length) return;
  if(!showBack){ showBack = true; render(); return; }
  // showBack=true → 次へ
  if(el.cross.checked && crossQueue.length){
    crossPtr = (crossPtr + 1) % crossQueue.length;
    idx = crossQueue[crossPtr];
  }else{
    idx = (idx + 1) % rowsView.length;
  }
  showBack = false; render();
});

el.prev.addEventListener("click", ()=>{
  if(!rowsView.length) return;
  if(showBack){ showBack = false; render(); return; }
  if(el.cross.checked && crossQueue.length){
    crossPtr = (crossPtr - 1 + crossQueue.length) % crossQueue.length;
    idx = crossQueue[crossPtr];
  }else{
    idx = (idx - 1 + rowsView.length) % rowsView.length;
  }
  showBack = true; render();
});

/* キーボード（必要なら） */
document.addEventListener("keydown", (e)=>{
  if(e.target.tagName === "INPUT" || e.target.tagName === "SELECT" || e.target.tagName === "TEXTAREA") return;
  if(e.key === "ArrowRight") el.next.click();
  else if(e.key === "ArrowLeft") el.prev.click();
  else if(e.key === " ") { e.preventDefault(); showBack=!showBack; render(); }
  else if(e.key.toLowerCase() === "l") { el.ok.checked = !el.ok.checked; el.ok.dispatchEvent(new Event("change")); }
});

/* 初期化 */
$("sideTitle").textContent = PAGE_NAME || "ページ";
load();
</script>
</body>
</html>
