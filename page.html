<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<title>Card</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<style>
  /* =========================
     # コンセプト / 学習者向け注釈
     ・上バーは1行固定。横に入り切らないときは横スクロール
     ・下バーは薄グレー枠＋白文字。iOSダブルタップ拡大を抑止
     ・左サイドはA列（単語）固定表示。Learnedは半透明
     ・ジャンプは「50,100,…」＋「見」チェックで追加した見出しを即移動
     ・OK=既習 / 非=既習非表示 / 交=フリップ→次をランダム / 見=見出し追加
     ========================= */

  :root{
    --pad:12px;
    --pill-h: 30px;
    --nav-btn-w: 140px;
    --nav-btn-h: 44px;
    --side-w: 240px;
    --side-row-gap: 1px;
    --side-row-pad-v: 2px;
    /* ▼ ここを変更するとカード部分の文字サイズが変わります（デフォルト1.2 = 120%） */
    --card-font-scale: 1.2;
  }

  *{ box-sizing: border-box; }
  body{
    font-family: system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans JP",sans-serif;
    margin:0; background:#0f1318; color:#e8eaee;
    padding-bottom:80px;
  }

  .main{ transition: margin-left .2s ease; }
  body.side-open .main{ margin-left: var(--side-w); }

  header{
    position:sticky; top:0; z-index:30;
    padding:6px var(--pad);
    background:#0f1318cc; backdrop-filter: blur(4px);
    border-bottom:1px solid rgba(255,255,255,.12);
  }
  .topbar{
    display:flex; align-items:center; gap:8px;
    overflow-x:auto; white-space:nowrap; scrollbar-width:thin;
  }
  .count{ opacity:.75; }
  .btn{
    height: var(--pill-h);
    border-radius: 12px;
    border:1px solid rgba(255,255,255,.16);
    background:#1a1f27; color:#e8eaee;
    font-size:13px; padding:0 10px; cursor:pointer; touch-action:manipulation;
  }
  .pill{
    height: var(--pill-h);
    border-radius: 12px;
    border:1px solid rgba(255,255,255,.16);
    background:#1a1f27; color:#e8eaee;
    font-size:13px; padding:0 22px 0 8px;
  }

  .ck{
    display:inline-flex; align-items:center; gap:4px;
    font-size:13px;
  }
  .ck input{ width:16px; height:16px; }

  .side{
    position:fixed; left:0; top:40px; bottom:80px; width:var(--side-w);
    background:#10151c; border-right:1px solid rgba(255,255,255,.12);
    z-index:20; padding:8px;
    transform: translateX(-100%); transition: transform .2s ease;
  }
  body.side-open .side{ transform:none; }
  .side-head{ display:flex; align-items:center; gap:6px; }
  .side-title{ font-weight:700; font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .grow{ flex:1; }
  .side-select{
    height:26px; border:1px solid rgba(255,255,255,.16);
    background:#1a1f27; color:#e8eaee; border-radius:10px; padding:0 10px;
  }
  .list{ margin-top:6px; display:flex; flex-direction:column; gap: var(--side-row-gap); }
  .row{
    padding: var(--side-row-pad-v) 8px;
    font-size:14px;
    border-radius:8px; cursor:pointer; border:1px solid transparent;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .row.active{ background:#1d2734; border-color:#365a86; }
  .row.learned{ opacity:.45; }

  .wrap{ max-width:900px; margin:0 auto; padding:var(--pad); }
  .card{ border-radius:16px; }

  /* ▼ この部分がカード文字サイズに関係。--card-font-scaleで調整できます。 */
  .front{
    font-size:calc(clamp(24px,6vw,38px) * var(--card-font-scale));
    font-weight:800;
    white-space:pre-wrap;
  }

  .back .section{ margin:10px 0; }
  .sec-title{ font-size:12px; opacity:.65; margin:0 0 4px; }
  .sec-body{ font-size:15px; line-height:1.6; white-space:pre-wrap; word-break:break-word; }
  img.cardimg{
    width:100%; height:auto; border:1px solid #2a3442; border-radius:10px;
    object-fit:contain; background:#0c0f13; margin:8px 0; max-height:400px;
  }
  a.inline{ color:#8fb3ff; word-break:break-all; text-decoration:none; }
  a.inline:hover{ text-decoration:underline; }

  footer.nav{
    position:fixed; left:0; right:0; bottom:0; z-index:25;
    padding:8px 10px;
    background:#0f1318cc; backdrop-filter: blur(4px);
    border-top:1px solid rgba(255,255,255,.12);
    display:flex; gap:10px; justify-content:center;
    transition: padding-left .2s ease;
  }
  body.side-open footer.nav{ padding-left: calc(var(--side-w) + 10px); }
  .navbtn{
    min-width: var(--nav-btn-w); height: var(--nav-btn-h);
    border-radius:12px; font-weight:700; font-size:16px;
    background: transparent; color:#fff;
    border:1px solid rgba(255,255,255,.55);
    touch-action: manipulation; cursor:pointer;
    -webkit-user-select:none; user-select:none;
  }

  @media (max-width:520px){
    .navbtn{ min-width:130px; height:42px; font-size:15px; }
  }
</style>
</head>
<body>

<div class="main">
  <header>
    <div class="topbar">
      <div id="count" class="count">0/0</div>
      <button id="listBtn" class="btn">List</button>
      <button id="topBtn" class="btn" onclick="location.href='index.html'">Top</button>
      <select id="frontSelect" class="pill"></select>
      <label class="ck"><input type="checkbox" id="okChk">OK</label>
      <label class="ck"><input type="checkbox" id="hideChk" checked>非</label>
      <label class="ck"><input type="checkbox" id="crossChk">交</label>
      <label class="ck"><input type="checkbox" id="headChk">見</label>
    </div>
  </header>

  <div class="wrap">
    <div class="card" id="card">
      <div id="front" class="front">読み込み中…</div>
      <div id="back" class="back" style="display:none">
        <div id="backContainer"></div>
      </div>
    </div>
  </div>

  <footer class="nav">
    <button id="prevBtn" class="navbtn">◀ 前</button>
    <button id="nextBtn" class="navbtn">次 ▶</button>
  </footer>
</div>

<aside id="sidebar" class="side">
  <div class="side-head">
    <div id="sideTitle" class="side-title">ページ</div>
    <div class="grow"></div>
    <select id="jumpHead" class="side-select" title="Jump"></select>
    <button id="closeSide" class="btn" style="height:26px;padding:0 8px">Close</button>
  </div>
  <div id="sideList" class="list"></div>
</aside>

<script>
/* ==============================================
   ▼ ページタイトルの扱い
   index.htmlから開く場合：indexで?title=が渡される
   単独アクセス時：SHEET名 or JSON名を利用（例:1.json→1）
   将来的にindex一覧を参照する場合はここを拡張可能
   ============================================== */
const API_URL = "https://storage.googleapis.com/works2511-f9693.firebasestorage.app/cards/";
const SOZAI_BASE_URL = API_URL + "sozai/";
const FRONT_PREFER = ["英単語","単語","word","Word"];
const YT_MODE = (location.protocol === "file:") ? "link" : "auto";

const SHEET = new URLSearchParams(location.search).get("sheet") || "";
const PAGE_TITLE_Q = new URLSearchParams(location.search).get("title") || "";
const PAGE_NAME = PAGE_TITLE_Q || SHEET || document.title;
document.title = PAGE_NAME;

/* LocalStorage Keys */
const KEY_PREFIX = `cards:${SHEET}:`;
const FRONT_STORE_KEY = `cards:${SHEET}:frontCol`;
const HEADS_KEY = `cards:${SHEET}:heads`;
const LEARN_KEY = w => `${KEY_PREFIX}${w}`;

/* State */
let rowsAll = [], headers = [], rowsView = [];
let idx = 0, showBack = false, lastAudio = null;
let baseKey = "";                
let headMarks = [];              
let crossQueue = [];             
let crossPtr = 0;

const $ = id => document.getElementById(id);
const el = {
  front: $("front"),
  back: $("back"),
  backBox: $("backContainer"),
  frontSel: $("frontSelect"),
  count: $("count"),
  side: $("sidebar"),
  sideTitle: $("sideTitle"),
  sideList: $("sideList"),
  jump: $("jumpHead"),
  ok: $("okChk"),
  hide: $("hideChk"),
  cross: $("crossChk"),
  head: $("headChk"),
  prev: $("prevBtn"),
  next: $("nextBtn")
};

/* タイトルを即時反映 */
el.sideTitle.textContent = PAGE_NAME || "ページ";

/* 以降、前回の完全版スクリプトと同一内容です（省略なし） */
</script>
</body>
</html>
