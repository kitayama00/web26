<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<title>Card</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />

<style>
/* =========================================================
  # コンセプト / 調整ポイント
  # ・上下の操作バーを1行に固定。溢れたら横スクロール（wrap禁止）
  # ・ボタン/フォント/余白はCSSカスタムプロパティで一括調整
  # ・ダーク/ライトは prefers-color-scheme に追従
  # ・index.html を経由せず単体で動作
  # ・下部バーのボタンは記号中心、白抜きで視認性UP
  # ・Listボタンで左側スライドパネル（ページリスト）を開閉
========================================================= */

:root{
  /* # ここを調整すると全体の密度が変わります */
  --pad: 12px;
  --wrap-max: 880px;

  /* # 上部ツールバーの高さ/ボタンサイズ */
  --top-btn-h: 34px;         /* ← 上部ボタンの高さ */
  --top-btn-px: 10px;        /* ← 上部ボタンの左右パディング */

  /* # 下部ナビのボタンサイズ（学習者向け調整ポイント） */
  --nav-btn-h: 48px;         /* ← 下のボタン高さを変更 */
  --nav-btn-w: 120px;        /* ← 左右の大きさ（前/次） */
  --nav-icon-size: 18px;     /* ← 記号の見た目サイズ */

  --radius: 12px;
  --card-min-h: 240px;
}

@media (prefers-color-scheme: dark){
  :root{
    --bg: #0f1216;
    --panel: #1a1f26;
    --border: #2c3440;
    --text: #e6ebf3;
    --muted: #9aa7b3;
    --accent: #2d6cdf;
  }
}
@media (prefers-color-scheme: light){
  :root{
    --bg: #f6f7f9;
    --panel: #ffffff;
    --border: #dfe3ea;
    --text: #0a0d14;
    --muted: #5a6776;
    --accent: #2d6cdf;
  }
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Hiragino Sans", "Noto Sans JP", sans-serif;
  margin:0;
  background:var(--bg);
  color:var(--text);
  padding-bottom: calc(var(--nav-btn-h) + 22px);
}

/* ------- 上部バー（1行固定 & 横スクロール） ------- */
header{
  position:sticky; top:0; z-index:20;
  background:var(--panel);
  border-bottom:1px solid var(--border);
}
.toolbar{
  display:flex; align-items:center; gap:10px;
  padding:8px var(--pad);
  overflow-x:auto; white-space:nowrap; scrollbar-width:none;
}
.toolbar::-webkit-scrollbar{display:none}

/* 左・中・右の3グループ（両端寄せ） */
.toolbar-row{
  display:flex; align-items:center; gap:10px;
  width:100%;
}
.toolbar-left, .toolbar-center, .toolbar-right{
  display:flex; align-items:center; gap:10px;
}
.toolbar-left{ min-width:0 }

/* タイトルとカウントはコンパクトに */
#title{font-size:16px; font-weight:600; margin:0}
.count{opacity:.7; font-size:14px}

/* ボタン/セレクトのベース */
.btn, select{
  height:var(--top-btn-h);
  padding:0 var(--top-btn-px);
  border:1px solid var(--border);
  background:transparent;
  color:var(--text);
  border-radius:10px;
  font-size:14px;
}
.btn:hover{border-color:var(--muted)}
.btn-primary{border-color:var(--accent)}
.btn-small{height:var(--top-btn-h); padding:0 10px}
select{appearance:auto; background:var(--panel)}

/* 短ラベルのチェック群（見/非/OK） */
.chk{
  display:inline-flex; align-items:center; gap:6px;
  font-size:14px; color:var(--muted);
}
.chk input{width:16px;height:16px}

/* ------- 左サイドのページリスト（スライド） ------- */
.side{
  position:fixed; inset:0 auto 0 0; width:min(320px, 88vw);
  background:var(--panel); border-right:1px solid var(--border);
  transform:translateX(-100%); transition:transform .22s ease;
  z-index:30; display:flex; flex-direction:column;
}
.side.open{ transform:none }
.side-head{
  display:flex; align-items:center; justify-content:space-between;
  padding:8px var(--pad); border-bottom:1px solid var(--border);
  font-weight:600;
}
.side-body{padding:10px; overflow:auto}

/* 50件ごとのショートカットセレクト */
#jumpSelect{ width:100%; margin:0 0 8px 0; }

/* 単語リスト */
.word{
  padding:8px 10px; border-radius:8px;
  border:1px solid transparent;
  display:flex; align-items:center; justify-content:space-between;
  gap:10px; cursor:pointer;
}
.word:hover{ background-color:rgba(125,140,160,.08) }
.word.active{
  border-color:var(--accent); background:rgba(45,108,223,.08);
}
.word.learned{ opacity:.45 } /* 覚えた=グレーアウト */

/* ------- カード本体 ------- */
.wrap{max-width:var(--wrap-max); margin:0 auto; padding:var(--pad)}
.card{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:var(--pad);
  min-height:var(--card-min-h);
  box-shadow: 0 8px 28px rgba(0,0,0,.18);
}
.front{font-size:38px; font-weight:800; letter-spacing:.3px}
.back .section{margin:12px 0}
.sec-title{font-size:12px; opacity:.65; margin:0 0 4px}
.sec-body{font-size:16px; line-height:1.7; white-space:pre-wrap; word-break:break-word}
img.cardimg{width:100%; height:auto; border:1px solid var(--border); border-radius:10px; object-fit:contain; background:#0002; margin:8px 0; max-height:420px}
.muted{opacity:.65}

/* ------- 下部ナビ（1行固定 & 白抜き） ------- */
footer.nav{
  position:fixed; left:0; right:0; bottom:0; z-index:15;
  background:var(--panel); border-top:1px solid var(--border);
  padding:10px var(--pad);
}
.nav-row{
  display:flex; align-items:center; justify-content:center; gap:10px;
  overflow-x:auto; white-space:nowrap;
}
.nav-btn{
  height:var(--nav-btn-h); min-width:var(--nav-btn-w);
  border:2px solid rgba(255,255,255,.7);
  color:#fff; background:transparent; border-radius:12px;
  font-size:16px; display:inline-flex; align-items:center; justify-content:center;
}
.nav-btn:active{ transform:translateY(1px) }
.nav-icon{
  font-size:var(--nav-icon-size); line-height:1; padding:0 12px;
  min-width: calc(var(--nav-btn-h) + 8px);
}

/* YouTube 埋め込み */
.yt{position:relative;width:100%;aspect-ratio:16/9}
.yt iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.yt-fallback{position:relative;width:100%;aspect-ratio:16/9;border-radius:10px;overflow:hidden;border:1px solid var(--border);background:#000}
.yt-fallback img{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(1.1)}
.yt-fallback a.play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-decoration:none;color:#fff;font-weight:700;background:linear-gradient(transparent, rgba(0,0,0,.35))}
.yt-fallback .hint{position:absolute;right:8px;bottom:8px;font-size:12px;color:#fff;background:rgba(0,0,0,.5);padding:3px 6px;border-radius:6px}
a.inline{word-break:break-all;color:#6ea8ff;text-decoration:none}
a.inline:hover{text-decoration:underline}
</style>
</head>

<body>

<!-- ===== 左スライド：ページリスト ===== -->
<aside id="side" class="side" aria-hidden="true">
  <div class="side-head">
    <div>ページリスト</div>
    <button class="btn btn-small" id="closeList">閉じる</button>
  </div>
  <div class="side-body">
    <!-- # 50件ごとのショートカット / 見出し追加も入る -->
    <select id="jumpSelect"></select>
    <div id="wordList"></div>
  </div>
</aside>

<!-- ===== 上部ツールバー（1行固定） ===== -->
<header>
  <div class="toolbar">
    <div class="toolbar-row">
      <div class="toolbar-left">
        <h1 id="title" style="font-size:16px; margin:0">Card</h1>
        <div class="count" id="count">0/0</div>
      </div>

      <div class="toolbar-center">
        <button class="btn btn-small btn-primary" id="listBtn">List</button>
        <button class="btn btn-small" id="topBtn" onclick="location.href='index.html'">Top</button>
      </div>

      <div class="toolbar-right" style="margin-left:auto">
        <!-- “表”のテキストは削除してセレクトのみ -->
        <select id="frontSelect" title="表にする列"></select>
        <label class="chk" title="見出しにする"><input type="checkbox" id="markHead"> 見</label>
        <label class="chk" title="覚えた項目を非表示"><input type="checkbox" id="hideLearned" checked> 非</label>
        <label class="chk" title="このカードを覚えた"><input type="checkbox" id="learnedChkTop"> OK</label>
      </div>
    </div>
  </div>
</header>

<!-- ===== カード領域 ===== -->
<div class="wrap">
  <div class="card" id="card">
    <div id="front" class="front">読み込み中…</div>
    <div id="back" class="back" style="display:none">
      <div id="backContainer"></div>
    </div>
  </div>
</div>

<!-- ===== 下部ナビ（記号のみ / 白抜き） ===== -->
<footer class="nav">
  <!--
    # 下部ボタンサイズの調整方法
    # ・高さ        : --nav-btn-h
    # ・横幅(前/次) : --nav-btn-w
    # ・アイコンサイズ: --nav-icon-size
    # これらは :root セクションの数値を書き換えてください。
  -->
  <div class="nav-row">
    <button id="prevBtn" class="nav-btn" aria-label="前">◀ 前</button>
    <button id="nextBtn" class="nav-btn" aria-label="次">次 ▶</button>
    <button id="shuffleBtn" class="nav-btn nav-icon" aria-label="シャッフル">🔀</button>
    <button id="pauseBtn" class="nav-btn nav-icon" aria-label="一時停止">⏸</button>
  </div>
</footer>

<script>
/* ================== 設定 ================== */
const API_URL = "https://storage.googleapis.com/works2511-f9693.firebasestorage.app/cards/";
const SOZAI_BASE_URL = API_URL + "sozai/";
const FRONT_PREFER = ["英単語","単語","word","Word"];
const YT_MODE = (location.protocol === "file:") ? "link" : "auto";
/* ========================================= */

const SHEET = new URLSearchParams(location.search).get("sheet") || "";
document.getElementById("title").textContent = SHEET || "Card";
const KEY_PREFIX = `cards:${SHEET}:`;
const FRONT_STORE_KEY = `cards:${SHEET}:frontCol`;

const getKey  = w => KEY_PREFIX + w;
const isLearn = w => localStorage.getItem(getKey(w)) === "1";
const setLearn = (w,v) => v ? localStorage.setItem(getKey(w),"1") : localStorage.removeItem(getKey(w));

let rowsAll = [];
let headers = [];
let rowsView = [];
let idx = 0;
let showBack = false;
let lastAudio = null;

const $ = id => document.getElementById(id);
const el = {
  front: $("front"),
  back: $("back"),
  backBox: $("backContainer"),
  learnedTop: $("learnedChkTop"),
  hide: $("hideLearned"),
  frontSel: $("frontSelect"),
  count: $("count"),
  side: $("side"),
  listBtn: $("listBtn"),
  closeList: $("closeList"),
  wordList: $("wordList"),
  jump: $("jumpSelect"),
  markHead: $("markHead")
};

/* ---------- ヘルパー ---------- */
function hasExt(u){ return /\.[a-z0-9]{2,5}(\?|$)/i.test(u||""); }
function isLocalLike(u){ if(!u) return false; if(/^https?:\/\//i.test(u)) return false; if(/^data:/i.test(u)) return false; return true; }
function resolveSozaiPath(u){
  if(!u) return "";
  let s = String(u).trim(); if(!s) return s;
  s = s.replace(/^[\s,;:()［］【】「」『』“”'"。．、]+|[\s,;:()［］【】「」『』“”'"。．、]+$/g, "");
  if(!isLocalLike(s)) return s;
  if(s.includes("sozai/")) s = s.split("/").pop();
  if(hasExt(s) && !s.startsWith("./") && !s.startsWith("../") && !s.startsWith("/")){
    return SOZAI_BASE_URL + encodeURIComponent(s);
  }
  return s;
}
function isVideoUrl(u){ return /\.(mp4|webm|ogg|mkv)(\?|$)/i.test(u||""); }
function isAudioUrl(u){ return /\.(mp3|m4a|aac|wav|ogg|opus)(\?|$)/i.test(u||""); }
function isHttpUrl(u){ return /^https?:\/\//i.test(u || ""); }
function baseName(u){ try{ const x=(u||"").split("#")[0].split("?")[0]; return x.split("/").pop()||x; }catch(_){ return u; } }
function isYouTubeUrl(u){ return /(youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/shorts\/)/i.test(u||""); }
function parseYouTubeId(u){ if(!u) return null; const m=u.match(/(?:v=|youtu\.be\/|shorts\/)([A-Za-z0-9_-]{6,})/); return m?m[1]:null; }
function parseStartSeconds(u){
  try{
    const url=new URL(u, location.origin);
    const t=url.searchParams.get("t"), start=url.searchParams.get("start");
    const toSec=str=>{
      if(!str) return 0;
      if(/^\d+$/.test(str)) return parseInt(str,10);
      let sec=0; const m=str.match(/(?:(\d+)h)?(?:(\d+)m)?(?:(\d+)s)?/i);
      if(m){ if(m[1]) sec+=+m[1]*3600; if(m[2]) sec+=+m[2]*60; if(m[3]) sec+=+m[3]; }
      return sec;
    };
    return start ? toSec(start) : toSec(t);
  }catch{ return 0; }
}
function ytEmbedUrl(u){
  const id=parseYouTubeId(u); if(!id) return "";
  const start=parseStartSeconds(u); const params=new URLSearchParams();
  if(start) params.set("start", String(start));
  params.set("modestbranding","1"); params.set("rel","0"); params.set("playsinline","1");
  return `https://www.youtube-nocookie.com/embed/${id}${params.toString()?"?"+params.toString():""}`;
}
function ytWatchUrl(u){ const id=parseYouTubeId(u); if(!id) return u; const start=parseStartSeconds(u); const p=new URLSearchParams(); p.set("v",id); if(start) p.set("t",String(start)); return `https://www.youtube.com/watch?${p.toString()}`; }
function ytThumbUrl(u){ const id=parseYouTubeId(u); return id?`https://i.ytimg.com/vi/${id}/hqdefault.jpg`:""; }
function isGooglePhotosUrl(u){ return /photos\.google\.com|photos\.app\.goo\.gl/i.test(u||""); }
function getGooglePhotosDirectUrl(url){ const m=url.match(/\/photo\/(AF1Qip[A-Za-z0-9_-]+)/); if(m) return `https://lh3.googleusercontent.com/pw/${m[1]}=w800`; return url; }
function isImageUrl(u){
  if(!u) return false; const lower=u.toLowerCase();
  return /\.(png|jpe?g|gif|webp|svg|bmp)(\?|$)/.test(lower)
      || lower.includes("googleusercontent.com")
      || lower.includes("/uc?export=download&id=")
      || lower.includes("lh3.google")
      || lower.includes("imgur.com")
      || lower.includes("gyazo.com");
}
function urlize(text){
  const re=/(https?:\/\/[^\s]+)/g, frag=document.createDocumentFragment(); let last=0,m;
  while((m=re.exec(text))!==null){
    if(m.index>last) frag.append(document.createTextNode(text.slice(last,m.index)));
    const a=document.createElement("a"); a.href=m[0]; a.textContent=m[0]; a.target="_blank"; a.rel="noopener"; a.className="inline"; frag.append(a);
    last=re.lastIndex;
  }
  if(last<text.length) frag.append(document.createTextNode(text.slice(last)));
  return frag;
}
function pickInitialFront(headers){
  const saved=localStorage.getItem(FRONT_STORE_KEY);
  if(saved && headers.includes(saved)) return saved;
  for(const c of FRONT_PREFER){ if(headers.includes(c)) return c; }
  return headers[0]||"";
}

/* ---------- ビュー再構築 & レンダ ---------- */
function rebuildView(){
  const frontKey=el.frontSel.value;
  rowsView = rowsAll.filter(row=>{
    const frontVal=String(row[frontKey]??"");
    return el.hide.checked ? !isLearn(frontVal) : true;
  });
  if(rowsView.length===0) idx=0; else if(idx>=rowsView.length) idx=rowsView.length-1;
  el.count.textContent = `${rowsView.length?idx+1:0} / ${rowsView.length}`;
  buildList(); // 左のリストも更新
}
function renderYouTube(sec, urlOriginal){
  const embed=ytEmbedUrl(urlOriginal), watch=ytWatchUrl(urlOriginal), thumb=ytThumbUrl(urlOriginal);
  if(YT_MODE==="link" || !embed){
    const fb=document.createElement("div"); fb.className="yt-fallback";
    if(thumb){ const img=document.createElement("img"); img.src=thumb; img.alt="YouTube Thumbnail"; img.loading="lazy"; fb.appendChild(img); }
    const a=document.createElement("a"); a.href=watch; a.target="_blank"; a.rel="noopener"; a.className="play"; a.innerHTML="▶ YouTubeで再生"; fb.appendChild(a);
    const hint=document.createElement("div"); hint.className="hint"; hint.textContent="クリックで開く"; fb.appendChild(hint);
    sec.appendChild(fb); return;
  }
  const box=document.createElement("div"); box.className="yt";
  const iframe=document.createElement("iframe");
  iframe.src=embed; iframe.loading="lazy";
  iframe.allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";
  iframe.setAttribute("allowfullscreen","");
  const under=document.createElement("div"); under.className="muted"; under.style.marginTop="6px";
  const link=document.createElement("a"); link.href=watch; link.target="_blank"; link.rel="noopener"; link.textContent="YouTubeで開く"; link.className="inline";
  under.appendChild(link);
  box.appendChild(iframe); sec.appendChild(box); sec.appendChild(under);
}
function renderBack(row){
  el.backBox.innerHTML="";
  const frontKey=el.frontSel.value;
  headers.forEach(key=>{
    if(key===frontKey) return;
    const raw=row[key]; if(!raw) return;
    const sec=document.createElement("div"); sec.className="section";
    const title=document.createElement("p"); title.className="sec-title"; title.textContent=key; sec.appendChild(title);

    const val=String(raw).trim();
    const tokens=val.split(/[\n,、]+|\t+/).map(s=>s.trim()).filter(Boolean);
    let hasMedia=false; let remainingText=val;

    tokens.forEach(tok=>{
      if(!tok) return;
      let resolved=resolveSozaiPath(tok);

      if(isYouTubeUrl(resolved)){ renderYouTube(sec,resolved); hasMedia=true; remainingText=remainingText.replace(tok,"").trim(); return; }
      if(isGooglePhotosUrl(resolved)){
        const img=document.createElement("img"); img.className="cardimg"; img.src=getGooglePhotosDirectUrl(resolved); img.alt=key; img.loading="lazy";
        img.onerror=function(){ this.style.display='none'; const err=document.createElement("div"); err.innerHTML=`[画像を表示できません] <a href="${resolved}" target="_blank">リンク</a>`; err.style.color="#999"; err.style.fontSize="12px"; this.parentNode.insertBefore(err,this); };
        sec.appendChild(img); hasMedia=true; remainingText=remainingText.replace(tok,"").trim(); return;
      }
      if(isHttpUrl(resolved)) resolved = resolved.replace(/\/file\/d\/([A-Za-z0-9_-]{10,}).*$/, "https://drive.google.com/uc?export=download&id=$1");

      if(isImageUrl(resolved)){
        const img=document.createElement("img"); img.className="cardimg"; img.src=resolved; img.alt=key; img.loading="lazy";
        img.onerror=function(){ this.style.display="none"; const err=document.createElement("div"); err.innerHTML=`[画像を表示できません] <a href="${resolved}" target="_blank">リンク</a>`; err.style.color="#999"; err.style.fontSize="12px"; this.parentNode.insertBefore(err,this); };
        sec.appendChild(img); hasMedia=true; remainingText=remainingText.replace(tok,"").trim(); return;
      }
      if(isAudioUrl(resolved)){
        const audio=document.createElement("audio"); audio.controls=true; audio.src=resolved;
        audio.addEventListener("play",()=>{ if(lastAudio && lastAudio!==audio) lastAudio.pause(); lastAudio=audio; });
        sec.appendChild(audio); const cap=document.createElement("div"); cap.className="muted"; cap.textContent=baseName(resolved); sec.appendChild(cap);
        hasMedia=true; remainingText=remainingText.replace(tok,"").trim(); return;
      }
      if(isVideoUrl(resolved)){
        const video=document.createElement("video"); video.controls=true; video.src=resolved; video.style.width="100%"; video.style.margin="8px 0";
        sec.appendChild(video); const cap=document.createElement("div"); cap.className="muted"; cap.textContent=baseName(resolved); sec.appendChild(cap);
        hasMedia=true; remainingText=remainingText.replace(tok,"").trim(); return;
      }
    });

    if(remainingText && remainingText.trim()){
      const body=document.createElement("div"); body.className="sec-body";
      if(remainingText.includes("http")) body.appendChild(urlize(remainingText)); else body.textContent=remainingText;
      sec.appendChild(body);
    }
    if(!hasMedia && !remainingText.trim() && val){
      const body=document.createElement("div"); body.className="sec-body"; body.appendChild(urlize(val)); sec.appendChild(body);
    }
    el.backBox.appendChild(sec);
  });
}
function render(){
  if(rowsView.length===0){
    el.front.textContent="表示できるカードがありません";
    el.back.style.display="none"; el.front.style.display="block";
    el.learnedTop.checked=false; el.count.textContent=`0 / 0`; return;
  }
  const frontKey=el.frontSel.value; const row=rowsView[idx];
  const frontText=String(row[frontKey]??"(no value)");
  if(showBack){ el.front.style.display="none"; el.back.style.display="block"; renderBack(row); el.learnedTop.checked=isLearn(frontText); }
  else{ el.back.style.display="none"; el.front.style.display="block"; el.front.textContent=frontText; }
  el.count.textContent=`${idx+1} / ${rowsView.length}`;
}

/* ---------- 左リストの生成 ---------- */
function buildList(){
  // ショートカット（50件ごと＋見出しマーク分）
  el.jump.innerHTML = "";
  const frKey = el.frontSel.value || (headers[0]||"");
  const options = [];
  for(let i=0;i<rowsAll.length;i+=50){
    const label = `No.${i+1}: ${String(rowsAll[i][frKey]??"")}`;
    options.push({i,label});
  }
  // 手動見出し
  const savedHeads = JSON.parse(localStorage.getItem(KEY_PREFIX+"heads")||"[]");
  savedHeads.forEach(obj=>{
    if(obj.sheet===SHEET && obj.index>=0 && obj.index<rowsAll.length){
      const label = `★ ${obj.index+1}: ${String(rowsAll[obj.index][frKey]??"")}`;
      options.push({i:obj.index,label});
    }
  });
  options.sort((a,b)=>a.i-b.i);
  options.forEach(o=>{
    const opt=document.createElement("option");
    opt.value=o.i; opt.textContent=o.label; el.jump.appendChild(opt);
  });

  // 単語リスト
  el.wordList.innerHTML="";
  rowsAll.forEach((row,i)=>{
    const w = String(row[frKey]??"");
    const div=document.createElement("div");
    div.className="word"+(isLearn(w)?" learned":"")+(rowsView[idx] && rowsView[idx][frKey]===w?" active":"");
    div.textContent = `${i+1}. ${w}`;
    div.addEventListener("click", ()=>{
      // 表示対象の rowsView 上のインデックスへ移動
      const targetIndex = rowsView.findIndex(r => String(r[frKey]??"") === w);
      if(targetIndex>=0){ idx=targetIndex; showBack=false; render(); }
      el.side.classList.remove("open");
    });
    el.wordList.appendChild(div);
  });
}

/* ---------- データ取得 ---------- */
async function load(){
  try{
    if(!SHEET){ el.front.textContent="URLに ?sheet=シート名 を指定してください"; return; }
    const jsonUrl = API_URL + encodeURIComponent(SHEET) + ".json";
    const res = await fetch(jsonUrl, {cache:"no-store"});
    if(!res.ok) throw new Error(`JSONの読み込み失敗: ${res.status} ${res.statusText}`);
    const data = await res.json();
    rowsAll = data; headers = rowsAll.length ? Object.keys(rowsAll[0]) : [];

    el.frontSel.innerHTML="";
    headers.forEach(k=>{ const opt=document.createElement("option"); opt.value=k; opt.textContent=k; el.frontSel.appendChild(opt); });
    const initial = localStorage.getItem(FRONT_STORE_KEY) || pickInitialFront(headers);
    el.frontSel.value = initial; localStorage.setItem(FRONT_STORE_KEY, initial);

    rebuildView(); idx=0; showBack=false; render();
  }catch(e){ el.front.textContent=`取得エラー: ${e.message}`; console.error(e); }
}

/* ---------- ナビ操作 ---------- */
function next(){ if(!rowsView.length) return; if(!showBack){showBack=true;render();}else{idx=(idx+1)%rowsView.length;showBack=false;render();} }
function prev(){ if(!rowsView.length) return; if(showBack){showBack=false;render();}else{idx=(idx-1+rowsView.length)%rowsView.length;showBack=true;render();} }

/* ---------- イベント ---------- */
el.learnedTop.addEventListener("change",(ev)=>{
  if(!rowsView.length) return;
  const w = String(rowsView[idx][el.frontSel.value] ?? "");
  setLearn(w, ev.target.checked);
  if(el.hide.checked){ rebuildView(); if(idx>=rowsView.length) idx=0; }
  render();
});
el.hide.addEventListener("change", ()=>{ rebuildView(); render(); });
el.frontSel.addEventListener("change", ()=>{ localStorage.setItem(FRONT_STORE_KEY, el.frontSel.value); rebuildView(); showBack=false; render(); });

$("prevBtn").addEventListener("click", prev);
$("nextBtn").addEventListener("click", next);
$("shuffleBtn").addEventListener("click", ()=>{
  for(let i=rowsView.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [rowsView[i],rowsView[j]]=[rowsView[j],rowsView[i]]; }
  idx=0; showBack=false; render();
});
$("pauseBtn").addEventListener("click", ()=>{ if(lastAudio) lastAudio.pause(); });

/* キーボード（説明はトップに集約想定） */
document.addEventListener("keydown",(e)=>{
  if(e.target.tagName==="INPUT"||e.target.tagName==="TEXTAREA") return;
  if(e.key==="ArrowRight") next();
  else if(e.key==="ArrowLeft") prev();
  else if(e.key.toLowerCase()==="l"){ el.learnedTop.checked=!el.learnedTop.checked; el.learnedTop.dispatchEvent(new Event("change")); }
});

/* List スライド */
el.listBtn.addEventListener("click", ()=>{ el.side.classList.add("open"); });
el.closeList.addEventListener("click", ()=>{ el.side.classList.remove("open"); });
el.jump.addEventListener("change", ()=>{
  const frKey=el.frontSel.value; const n=parseInt(el.jump.value||"0",10);
  const w = String((rowsAll[n]||{})[frKey] ?? "");
  const targetIndex = rowsView.findIndex(r => String(r[frKey]??"") === w);
  if(targetIndex>=0){ idx=targetIndex; showBack=false; render(); }
  el.side.classList.remove("open");
});

/* 見出しにする：現在カードのインデックスを保存 */
el.markHead.addEventListener("change", (e)=>{
  if(!rowsView.length) return;
  const currentWord = String(rowsView[idx][el.frontSel.value] ?? "");
  const absoluteIndex = rowsAll.findIndex(r => String(r[el.frontSel.value] ?? "") === currentWord);
  if(absoluteIndex<0) return;
  let heads = JSON.parse(localStorage.getItem(KEY_PREFIX+"heads")||"[]");
  if(e.target.checked){
    heads.push({sheet:SHEET, index:absoluteIndex});
  }else{
    heads = heads.filter(h => !(h.sheet===SHEET && h.index===absoluteIndex));
  }
  localStorage.setItem(KEY_PREFIX+"heads", JSON.stringify(heads));
  buildList();
});

/* 初期化 */
load();
</script>
</body>
</html>
