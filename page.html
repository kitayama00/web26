<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<title>Card</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<style>
  /* === 基本 === */
  *{box-sizing:border-box}
  :root{
    --pad:12px;
    --nav-btn-w: 140px;
    --nav-btn-h: 46px;
    --pill-h: 30px;
  }

  body{
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans JP",sans-serif;
    margin:0;
    background:#0f1318;
    color:#e8eaee;
    padding-bottom:80px;
  }

  header{
    position:sticky;top:0;z-index:20;
    padding:6px var(--pad);
    border-bottom:1px solid rgba(255,255,255,.12);
    background:#0f1318cc;
    backdrop-filter:blur(4px);
  }
  .topbar{display:flex;align-items:center;gap:8px;overflow-x:auto;white-space:nowrap}
  .count{min-width:44px;opacity:.7}
  .btn{height:var(--pill-h);padding:0 10px;border-radius:12px;background:#1a1f27;border:1px solid rgba(255,255,255,.15);color:#e8eaee;font-size:13px;cursor:pointer}
  select.pill{height:var(--pill-h);border-radius:12px;padding:0 20px 0 8px;background:#1a1f27;border:1px solid rgba(255,255,255,.15);color:#e8eaee}
  label.cb{display:inline-flex;align-items:center;gap:4px;font-size:13px}

  .layout{display:flex}
  .side{
    position:fixed;inset:40px auto 80px 0;width:300px;flex:0 0 300px;
    background:#10151c;border-right:1px solid rgba(255,255,255,.12);
    padding:8px;transform:translateX(-100%);
    transition:transform .2s ease;z-index:15;
  }
  .side.open{transform:none}
  .side-head{display:flex;align-items:center;gap:6px;margin-bottom:4px}
  .side-title{font-weight:700;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .grow{flex:1}
  .side-select{height:26px;border:1px solid rgba(255,255,255,.16);background:#1a1f27;color:#e8eaee;border-radius:10px;padding:0 10px}
  .list{margin:4px 0 0;display:flex;flex-direction:column;gap:2px}
  .row{padding:3px 6px;border-radius:8px;cursor:pointer;font-size:13px;border:1px solid transparent}
  .row.active{background:#1d2734;border-color:#365a86}
  .row.learned{opacity:.45}

  .wrap{max-width:900px;margin:0 auto;padding:var(--pad)}
  .card{border-radius:16px;padding:14px}
  .front{font-size:clamp(24px,6vw,38px);font-weight:800;white-space:pre-wrap}
  .back .section{margin:10px 0}
  .sec-title{font-size:12px;opacity:.65;margin:0 0 2px}
  .sec-body{font-size:15px;line-height:1.6;white-space:pre-wrap;word-break:break-word}

  footer.nav{
    position:fixed;left:0;right:0;bottom:0;
    border-top:1px solid rgba(255,255,255,.12);
    background:#0f1318cc;backdrop-filter:blur(4px);
    padding:6px 10px;display:flex;gap:10px;justify-content:center;
  }
  .navbtn{
    min-width:var(--nav-btn-w);height:var(--nav-btn-h);
    border-radius:12px;background:transparent;color:#fff;
    border:1px solid rgba(255,255,255,.55);
    font-size:16px;font-weight:700;
  }

  @media(max-width:480px){
    .side{width:80vw}
    .navbtn{min-width:130px;height:44px}
  }
</style>
</head>
<body>
<header>
  <div class="topbar">
    <div class="count" id="count">0/0</div>
    <button class="btn" id="listBtn">List</button>
    <button class="btn" id="topBtn" onclick="location.href='index.html'">Top</button>
    <select id="frontSelect" class="pill"></select>
    <label class="cb"><input type="checkbox" id="okChk">OK</label>
    <label class="cb"><input type="checkbox" id="hideChk" checked>非</label>
    <label class="cb"><input type="checkbox" id="crossChk">交</label>
    <label class="cb"><input type="checkbox" id="headChk">見</label>
  </div>
</header>

<aside class="side" id="sidebar">
  <div class="side-head">
    <div class="side-title" id="sideTitle">ページ</div>
    <div class="grow"></div>
    <select id="jumpHead" class="side-select"></select>
    <button class="btn" id="closeSide">Close</button>
  </div>
  <div class="list" id="sideList"></div>
</aside>

<div class="wrap">
  <div class="card">
    <div id="front" class="front">読み込み中…</div>
    <div id="back" class="back" style="display:none">
      <div id="backContainer"></div>
    </div>
  </div>
</div>

<footer class="nav">
  <button id="prevBtn" class="navbtn">◀ 前</button>
  <button id="nextBtn" class="navbtn">次 ▶</button>
</footer>

<script>
const API_URL="https://storage.googleapis.com/works2511-f9693.firebasestorage.app/cards/";
const SOZAI_BASE_URL=API_URL+"sozai/";
const SHEET=new URLSearchParams(location.search).get("sheet")||"";
const PAGE_NAME=new URLSearchParams(location.search).get("title")||SHEET||document.title;
document.title=PAGE_NAME;
let rowsAll=[],rowsView=[],headers=[],idx=0,showBack=false,BASE_KEY="";
const $=id=>document.getElementById(id);
const el={front:$("front"),back:$("back"),backBox:$("backContainer"),frontSel:$("frontSelect"),count:$("count"),side:$("sidebar"),sideTitle:$("sideTitle"),sideList:$("sideList"),jump:$("jumpHead"),ok:$("okChk"),hide:$("hideChk"),cross:$("crossChk"),head:$("headChk")};

function render(){if(!rowsView.length){el.front.textContent="なし";el.back.style.display="none";return;}
const r=rowsView[idx];const word=r[BASE_KEY];
if(showBack){el.back.style.display="block";el.front.style.display="none";el.backBox.textContent=JSON.stringify(r,null,2);}
else{el.back.style.display="none";el.front.style.display="block";el.front.textContent=r[el.frontSel.value]||word;}
el.count.textContent=`${idx+1}/${rowsView.length}`;}
async function load(){if(!SHEET){el.front.textContent="?sheet=指定なし";return;}
const res=await fetch(API_URL+SHEET+".json");const data=await res.json();rowsAll=data;headers=Object.keys(data[0]);BASE_KEY=headers[0];headers.forEach(h=>{const o=document.createElement("option");o.value=h;o.textContent=h;el.frontSel.append(o);});
rowsView=rowsAll;render();}
$("listBtn").onclick=()=>el.side.classList.add("open");
$("closeSide").onclick=()=>el.side.classList.remove("open");
$("nextBtn").onclick=()=>{if(!rowsView.length)return;if(showBack){idx=(idx+1)%rowsView.length;showBack=false;}else showBack=true;render();};
$("prevBtn").onclick=()=>{if(!rowsView.length)return;if(showBack){showBack=false;}else{idx=(idx-1+rowsView.length)%rowsView.length;showBack=true;}render();};
load();
</script>
</body>
</html>
